[project]
name = "bleached-coral"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.3.0,<2.4",
    "pandas>=2.2.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.0",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "ydata-profiling>=4.18.4",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
]

[tool.uv]
index-strategy = "unsafe-best-match"
